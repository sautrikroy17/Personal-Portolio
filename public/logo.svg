<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="sr-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" fill="#09090b" rx="20" />
  
  <g transform="translate(0, 0)">
    <!-- S Character -->
    <path
      d="M 45 35 C 45 20, 20 20, 20 35 C 20 55, 45 45, 45 65 C 45 80, 20 80, 20 65"
      fill="transparent"
      stroke="url(#sr-grad)"
      stroke-width="7"
      stroke-linecap="round"
    />
    
    <!-- R Character -->
    <path
      d="M 55 25 L 55 75 M 55 25 C 80 25, 80 50, 55 50 L 75 75"
      fill="transparent"
      stroke="url(#sr-grad)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
